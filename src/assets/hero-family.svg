<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-hidden="true">
  <title>Abstract illustration representing a family</title>
  <defs>
    <linearGradient id="family-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FAF8F5" />
    </linearGradient>
  </defs>

  <rect width="640" height="800" fill="url(#family-bg)" />
  <circle cx="460" cy="190" r="260" fill="#00A4A6" fill-opacity="0.12" />
  <circle cx="120" cy="700" r="140" fill="#0E3A3B" fill-opacity="0.05" />

  <!-- Guardian A -->
  <circle cx="220" cy="418" r="58" fill="#2A2724" />
  <path d="M120,620 C120,545 150,470 150,470 L290,470 C290,470 320,545 320,620 Z" fill="#2A2724" />

  <!-- Guardian B -->
  <circle cx="400" cy="414" r="54" fill="#2A2724" />
  <path d="M308,600 C308,532 336,463 336,463 L464,463 C464,463 492,532 492,600 Z" fill="#2A2724" />

  <!-- Child, drawn last so it reads as standing between the two guardians -->
  <circle cx="310" cy="584" r="34" fill="#046A6C" />
  <path d="M256,680 C256,648 272,615 272,615 L348,615 C348,615 364,648 364,680 Z" fill="#046A6C" />

  <circle cx="345" cy="560" r="6" fill="#00A4A6" />
</svg>
