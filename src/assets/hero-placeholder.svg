<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-hidden="true">
  <title>Placeholder illustration: two adults and a child sharing one task at one kitchen counter</title>
  <desc>
    TEMPORARY placeholder. Abstract, faceless, invented figures — these are not
    DirectHired families, helpers or staff, and nothing here may ever be captioned,
    named or presented as a real person (master brief §55). Replace with commissioned
    photography per docs/design/photography-brief.md: ONE frame, one room, one light,
    both adults in it, same scale, same plane, both engaged in the same ordinary task.
    Colours are the approved tokens only (#FAF8F5 surface, #FFFFFF raised, #2A2724 ink,
    #4d4d4d ink-muted, #DDD8D1 border, #046A6C accent, #00A4A6 brand teal — graphic use
    only, never text — #0E3A3B deep). Drawn 5:4; CSS crops to 4:3 below 64em, so keep
    everything meaningful inside the middle 94% of the height.
  </desc>

  <defs>
    <linearGradient id="hero-room" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FAF8F5" />
    </linearGradient>
    <linearGradient id="hero-light" x1="0" y1="0" x2="0.9" y2="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Room: one wall, one floor, one warm ambient wash -->
  <rect width="1400" height="1120" fill="url(#hero-room)" />
  <circle cx="1210" cy="150" r="330" fill="#00A4A6" fill-opacity="0.10" />
  <rect y="884" width="1400" height="236" fill="#0E3A3B" fill-opacity="0.05" />

  <!-- One window: the single light source, so both people are lit the same way -->
  <rect x="86" y="150" width="312" height="430" rx="10" fill="#FFFFFF" stroke="#DDD8D1" stroke-width="9" />
  <g stroke="#DDD8D1" stroke-width="9" stroke-linecap="round">
    <path d="M242,150 V580" />
    <path d="M86,372 H398" />
  </g>
  <path d="M398,206 L616,206 L968,1120 L472,1120 Z" fill="url(#hero-light)" />

  <!--
    Two adults, drawn at the same scale, on the same plane, in the same ink.
    Neither is marked out as employer or helper: no uniform, no props of rank,
    no difference in weight. The pair is the point.
  -->
  <g fill="#2A2724">
    <!-- Adult, left of centre -->
    <circle cx="470" cy="380" r="56" />
    <rect x="448" y="416" width="44" height="64" rx="20" />
    <path d="M392,700 C392,566 398,506 440,482 C456,472 484,472 500,482 C542,506 548,566 548,700 Z" />

    <!-- Adult, right of centre — a little taller, a little narrower, so the two
         read as two people rather than one figure stamped twice -->
    <circle cx="944" cy="368" r="54" />
    <rect x="924" y="404" width="42" height="66" rx="19" />
    <path d="M872,700 C872,556 878,496 918,472 C934,462 960,462 976,472 C1016,496 1022,556 1022,700 Z" />
  </g>

  <!-- Both arms reach in to the same object on the counter, from opposite sides -->
  <g fill="none" stroke="#2A2724" stroke-linecap="round">
    <path d="M534,526 C588,554 608,614 640,668" stroke-width="30" />
    <path d="M880,514 C832,546 800,608 762,668" stroke-width="28" />
  </g>

  <!--
    The counter is the crossbar. It runs the full width of the frame, passes
    behind everyone, and every figure meets it. This is the logo's H: two
    uprights JOINED by one horizontal, not two panels held apart by a seam.
    #00A4A6 is used here as a graphic rule only — never as text or a fill
    behind text (see the token warning in src/styles/tokens.css).
  -->
  <rect x="172" y="710" width="1056" height="174" fill="#FFFFFF" stroke="#DDD8D1" stroke-width="4" />
  <rect x="172" y="884" width="1056" height="18" fill="#0E3A3B" fill-opacity="0.07" />
  <rect x="148" y="692" width="1104" height="16" rx="8" fill="#00A4A6" />

  <!-- One ordinary shared task, and the ordinary things around it -->
  <g fill="#FFFFFF" stroke="#4d4d4d" stroke-width="6" stroke-linejoin="round">
    <path d="M664,652 C664,678 680,692 700,692 C720,692 736,678 736,652 Z" />
    <rect x="264" y="638" width="52" height="54" rx="6" />
    <path d="M1122,636 h72 l-10,56 h-52 z" />
  </g>
  <g fill="none" stroke="#4d4d4d" stroke-width="6" stroke-linecap="round">
    <path d="M654,652 H746" />
    <path d="M320,650 C338,652 338,678 320,680" />
  </g>
  <g fill="none" stroke="#046A6C" stroke-width="8" stroke-linecap="round">
    <path d="M1158,636 C1158,596 1142,574 1118,562" />
    <path d="M1158,636 C1158,604 1172,586 1194,578" />
  </g>

  <!--
    A child in front of the counter, reaching up to the same bar. Drawn last
    and in the accent so the frame has depth: three planes, one room.
  -->
  <g fill="#046A6C">
    <circle cx="700" cy="806" r="50" />
    <rect x="684" y="840" width="32" height="62" rx="14" />
    <path d="M628,1120 C628,978 640,918 672,894 C686,884 714,884 728,894 C760,918 772,978 772,1120 Z" />
  </g>
  <g fill="none" stroke="#046A6C" stroke-width="24" stroke-linecap="round">
    <path d="M652,930 C620,880 598,772 578,684" />
    <path d="M748,930 C780,880 802,772 822,684" />
  </g>
</svg>
