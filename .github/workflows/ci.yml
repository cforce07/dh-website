name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # IMPORTANT: this must stay `build:dev`, not `build`.
      #
      # `npm run build` runs the <Tbd> gate, which fails the build while any
      # placeholder value is still in the rendered output.
      #
      # The gate currently PASSES. DirectHired supplied the MOM licence
      # number on 2026-08-15, that <Tbd> was removed, and no other call site
      # exists in src/ — so `npm run build` succeeds today. This comment used
      # to say the gate "is expected to fail until the licence number is
      # supplied"; that was true when it was written and stopped being true
      # the day the value landed.
      #
      # `build:dev` is still the right command, for a reason that does not
      # depend on today's state: CI needs a `dist/` to test and audit
      # regardless of whether some future value is outstanding, and the gate
      # is a release check, not a build step. Pinning CI to `build` would
      # make the whole pipeline go red the next time a legitimate <Tbd>
      # lands — and a red pipeline invites deleting the placeholder or the
      # gate to make it green, which defeats the mechanism entirely.
      - name: Build (dev, gate skipped)
        run: npm run build:dev

      # Core-pages design spec §6: "axe at zero violations" on EVERY page.
      # @axe-core/cli was installed as a devDependency but nothing invoked
      # it, so the requirement was declared and never met; then the script
      # that invoked it audited only the homepage, so it was met for one
      # page out of two and would have drifted further with each page
      # added. scripts/run-axe.mjs now derives the page list from dist/, so
      # a new page is audited the moment it is built and nobody has to
      # remember to add it here. It serves the built dist/ via Astro's
      # preview server and audits every route with axe-core in headless
      # Chrome (bundled chromedriver — no extra setup, Chrome is
      # preinstalled on ubuntu-latest). It exits non-zero on ANY WCAG 2.1
      # A/AA violation on ANY page, which fails this job. Runs after the
      # build step above because it audits the built output, not the dev
      # server.
      - name: Run axe (accessibility)
        run: npm run axe

      - name: Run Lighthouse CI
        run: npx @lhci/cli autorun
